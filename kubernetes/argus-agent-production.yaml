# argus-agent as a DaemonSet on the Azure cluster, shipping every pod's logs
# (and, via the RBAC below, Ready-based liveness) to the super-argus server
# running on the bw-server home-LAN host, at https://argus.charlesragone.com
# (see ARGUS.md). Adapted from the upstream template at
# https://github.com/cragone/super-argus/blob/main/agent/deploy/daemonset.yaml.
#
# One-time setup (see ARGUS.md for the full rollout):
#   sudo kubectl create namespace argus
#   sudo kubectl -n argus create secret generic argus-agent --from-literal=api-key=argus_xxx
#   sudo kubectl apply -f kubernetes/argus-agent-production.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus-agent
  namespace: argus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argus-agent
rules:
  # get/list/watch on pods is namespace- and node-unscoped in RBAC; this
  # agent still only queries its own node, via a spec.nodeName field selector.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argus-agent
subjects:
  - kind: ServiceAccount
    name: argus-agent
    namespace: argus
roleRef:
  kind: ClusterRole
  name: argus-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: argus-agent
  namespace: argus
spec:
  selector:
    matchLabels: { app: argus-agent }
  template:
    metadata:
      labels: { app: argus-agent }
    spec:
      serviceAccountName: argus-agent
      tolerations:
        - operator: Exists # also run on tainted nodes
      containers:
        - name: agent
          image: argus-agent:latest # built from super-argus's agent/Dockerfile, pushed to ACR -- see ARGUS.md
          env:
            - name: ARGUS_URL
              value: https://argus.charlesragone.com
            - name: ARGUS_API_KEY
              valueFrom:
                secretKeyRef: { name: argus-agent, key: api-key }
            - name: ARGUS_AGENT_MODE
              value: kubernetes
            - name: ARGUS_STATE_DIR
              value: /state
            - name: ARGUS_LABELS
              value: cluster=azure
            - name: ARGUS_EXCLUDE_NAMESPACES
              value: argus # do not ship the agent's own logs
            - name: ARGUS_NODE_NAME # scopes the pod-liveness watch to this node
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
            - { name: state, mountPath: /state }
      volumes:
        - name: pods
          hostPath: { path: /var/log/pods }
        - name: state
          hostPath: { path: /var/lib/argus-agent, type: DirectoryOrCreate }
