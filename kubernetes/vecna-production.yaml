# Applied to the single-node k3s cluster running on the bw-server home-LAN
# host itself (see VECNA.md) — not the main cloud cluster, which has no
# reachability to the Shelly plug's local RPC API. The image is built and
# imported directly into that k3s node's containerd by
# vecna/scripts/deploy-bw-server.sh, so no registry/imagePullSecrets needed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prod-vecna-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-vecna
  namespace: default
spec:
  # SQLite lives on a single ReadWriteOnce volume, so this must stay at 1 replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prod-vecna
  template:
    metadata:
      labels:
        app: prod-vecna
    spec:
      containers:
        - name: prod-vecna
          image: placeholder # replaced by deploy-bw-server.sh via kubectl set image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: "80"
            - name: DATA_DIR
              value: /data
            - name: SHELLY_HOST
              value: 192.168.1.26
            - name: SHELLY_NAME
              value: ""
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prod-vecna-data
---
apiVersion: v1
kind: Service
metadata:
  name: prod-vecna-service
  namespace: default
spec:
  selector:
    app: prod-vecna
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
