# BasicAuth-protected Traefik route for gear-box.charlesragone.com, reached
# via the same Cloudflare Tunnel on the bw-server host as vecna (see
# GEAR-BOX.md and VECNA.md). Deliberately reuses vecna's existing
# vecna-basic-auth Middleware/Secret by name rather than creating a new one
# — one set of credentials unlocks both home-LAN control apps. See
# kubernetes/vecna-ingress.yaml for how that Secret is created on the host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gear-box-web
  namespace: default
spec:
  # "web" (plain HTTP, :80), not "websecure": the Cloudflare Tunnel terminates
  # TLS at Cloudflare's edge and talks to this node over loopback-only HTTP,
  # so Traefik needs no cert of its own here — same as vecna's route.
  entryPoints:
    - web
  routes:
    # Carve-out for mic_listener: it can't do vecna-basic-auth's interactive
    # login, and the LAN NodePort path (see gear-box-production.yaml) turned
    # out to be blocked for this one device specifically (confirmed: ICMP to
    # it is clean and other LAN clients reach the NodePort fine, but the
    # mic's own outbound TCP connects to it are refused -- looks like
    # router-level device isolation we don't have access to diagnose
    # further). Routing over the public hostname instead sidesteps whatever
    # that is, since it's a LAN-to-LAN path, not LAN-to-internet. Higher
    # priority than the rule below so it's matched first; MIC_API_TOKEN is
    # the only thing gating this path now that it's reachable from the
    # public internet, so it must be set (see hear.go) -- unlike the
    # NodePort, where it was optional on the assumption only the LAN could
    # reach it at all.
    - match: Host(`gear-box.charlesragone.com`) && PathPrefix(`/hear`)
      kind: Rule
      priority: 20
      services:
        - name: prod-gear-box-service
          port: 80
    - match: Host(`gear-box.charlesragone.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: vecna-basic-auth
      services:
        - name: prod-gear-box-service
          port: 80
