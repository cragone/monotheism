# Applied to the single-node k3s cluster running on the bw-server home-LAN
# host itself (see GEAR-BOX.md and VECNA.md) — not the main cloud cluster,
# which has no reachability to the sound_machine ESP32 on the home LAN. The
# image is built and imported directly into that k3s node's containerd by
# gear-box/scripts/deploy-local.sh, so no registry/imagePullSecrets needed.
#
# No PVC: gear-box keeps no persistent state at all — it doesn't even hold
# spoken text in memory past the request that pushes it to the ESP32 — so
# the default RollingUpdate strategy is fine too (no SQLite single-writer
# constraint forcing Recreate).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-gear-box
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prod-gear-box
  template:
    metadata:
      labels:
        app: prod-gear-box
    spec:
      containers:
        - name: prod-gear-box
          image: placeholder # replaced by deploy-bw-server.sh via kubectl set image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: "80"
            - name: ESP32_HOST
              # A static LAN IP (DHCP-reserved, see GEAR-BOX.md), not
              # soundmachine.local — mDNS reaching pod-land through k3s's
              # network namespace is an extra moving part not worth
              # debugging when a fixed IP works unconditionally.
              value: 192.168.1.249
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
# NodePort, not ClusterIP: the mic_listener ESP32 (and any future LAN
# device) needs to reach gear-box's /hear directly, the same bare-LAN-trust
# model sound_machine's /speak already uses -- the public hostname is
# gated by vecna-basic-auth, which a device can't log into, and there's no
# separate path-scoped bypass for it in the Traefik IngressRoute. This
# NodePort exposes the whole app (not just /hear) unauthenticated on the
# LAN at <node-ip>:30080; /hear itself is still gated by MIC_API_TOKEN if
# set. The IngressRoute in gear-box-ingress.yaml still targets this same
# Service by name/port and is unaffected -- Traefik resolves it via the
# Service's ClusterIP, which a NodePort Service still has.
apiVersion: v1
kind: Service
metadata:
  name: prod-gear-box-service
  namespace: default
spec:
  selector:
    app: prod-gear-box
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
