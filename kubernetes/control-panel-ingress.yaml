# BasicAuth-protected Traefik route for control-panel.charlesragone.com,
# reached via a Cloudflare Tunnel on the raspi5 host rather than a public
# ingress IP (see CONTROL-PANEL.md). The htpasswd credentials live in the
# control-panel-basic-auth Secret, created once by hand on the host (never
# committed), same pattern as vecna-ingress.yaml:
#
#   openssl passwd -apr1 > creates one "user:hash" line by hand, saved to
#   e.g. /home/charlie/control-panel-basic-auth-users, then:
#
#   sudo k3s kubectl create secret generic control-panel-basic-auth \
#     --from-file=users=/home/charlie/control-panel-basic-auth-users -n default
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: control-panel-basic-auth
  namespace: default
spec:
  basicAuth:
    secret: control-panel-basic-auth
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: control-panel-web
  namespace: default
spec:
  # "web" (plain HTTP, :80), not "websecure": the Cloudflare Tunnel terminates
  # TLS at Cloudflare's edge and talks to this node over loopback-only HTTP
  # (config.yml's `service: http://localhost:80`), so Traefik needs no cert
  # of its own here.
  entryPoints:
    - web
  routes:
    - match: Host(`control-panel.charlesragone.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: control-panel-basic-auth
      services:
        - name: prod-control-panel-web-service
          port: 80
