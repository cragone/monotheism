[package]
name = "control-panel-kiosk"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
slint-build = "1.8"

[[bin]]
name = "control-panel-kiosk"
path = "src/main.rs"
