name: Production Deployment of anniversary.charlesragone.com

on:
  push:
    branches: [main]
    paths:
      - "anniversary/**"
      - "kubernetes/anniversary-production.yaml"
      - ".github/workflows/production_anniversary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Configure SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.AZURE_VM_IP }}" >> ~/.ssh/known_hosts

      - name: SSH into VM and deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: azureuser
          key: ${{ secrets.AZURE_PEM_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            cd monotheism
            git fetch origin main
            git reset --hard origin/main

            ACR="${{ secrets.ACR_LOGIN_SERVER }}"
            FULL_IMAGE="$ACR/anniversary-client:${{ env.sha_short }}"

            echo "${{ secrets.ACR_PASSWORD }}" | sudo docker login "$ACR" -u "${{ secrets.ACR_USERNAME }}" --password-stdin
            sudo docker build -t "$FULL_IMAGE" -f anniversary/Dockerfile anniversary
            sudo docker push "$FULL_IMAGE"

            sudo kubectl apply -f kubernetes/anniversary-production.yaml
            sudo kubectl apply -f kubernetes/charles_ingress.yaml

            sudo kubectl -n default set image deployment/prod-anniversary-services \
              prod-anniversary-services="$FULL_IMAGE"
            sudo kubectl -n default rollout status deployment/prod-anniversary-services

            echo "SUCCESS: Deployed $FULL_IMAGE"
